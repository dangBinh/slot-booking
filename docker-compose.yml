services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: slot-booking-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /data/dev.sqlite
    volumes:
      - sqlite_data:/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"query\":\"{__typename}\"}' --header='Content-Type: application/json' http://localhost:4000/graphql || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser runs on the host, so it reaches the api at the host-exposed port.
        VITE_API_URL: http://localhost:4000/graphql
    image: slot-booking-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
